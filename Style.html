<!-- Style.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root {
    /* ============================================================
       BPS Sensus Ekonomi 2026 — Vibrant Amber-Orange Color System
       Bright, fresh, professional — clearly orange, not brick-red
    ============================================================ */
    --primary:          #f78c00;   /* Vivid amber-orange — main brand color      */
    --primary-dark:     #d46b00;   /* Deep amber — hover, header, dark surfaces   */
    --primary-deeper:   #b85c00;   /* Darkest amber — text on light, shadows      */
    --primary-light:    #fff4e6;   /* Very light warm cream — subtle tints        */
    --primary-pale:     #fff8f0;   /* Near-white warm bg                          */
    --primary-gradient: linear-gradient(135deg, #ffb830 0%, #f78c00 60%, #e07200 100%);

    --accent:           #0a3c91;   /* BPS Corporate Navy Blue Accent              */
    --accent-light:     #e8eef8;

    --success:          #2e7d32;
    --success-light:    #e8f5e9;
    --warning:          #f57c00;
    --warning-light:    #fff3e0;
    --danger:           #c62828;
    --danger-light:     #ffebee;

    --light-bg:         #fdf6ee;   /* Warm off-white page background              */
    --card-bg:          #ffffff;
    --border-color:     #fde0b8;   /* Light amber border                          */
    --border-strong:    #f5c070;   /* Medium amber border for emphasis            */

    --text-main:        #1a1a1a;
    --text-muted:       #6b7280;
    --text-light:       #9ca3af;

    --sidebar-width:            260px;
    --sidebar-collapsed-width:   70px;

    --transition-speed: 0.25s;
    --shadow-sm:  0 2px 6px  rgba(212, 107,   0, 0.07);
    --shadow-md:  0 4px 16px rgba(212, 107,   0, 0.12);
    --shadow-lg:  0 8px 28px rgba(184,  92,   0, 0.18);
    --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.06);

    --border-radius-sm: 6px;
    --border-radius-md: 10px;
    --border-radius-lg: 16px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text-main);
    background-color: var(--light-bg);
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* Custom Modern Slim Scrollbars */
  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }
  ::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.03);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(230, 81, 0, 0.3);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(230, 81, 0, 0.6);
  }

  /* Layout Containers (No Top Navbar) */
  #app-wrapper {
    display: flex;
    min-height: 100vh;
  }

  #main-panel {
    flex-grow: 1;
    margin-left: var(--sidebar-width);
    padding-top: 0;
    transition: margin-left var(--transition-speed) ease;
    display: flex;
    flex-direction: column;
    width: calc(100% - var(--sidebar-width));
    min-height: 100vh;
  }

  body.sidebar-collapsed #main-panel {
    margin-left: var(--sidebar-collapsed-width);
    width: calc(100% - var(--sidebar-collapsed-width));
  }

  #content-area {
    padding: 24px 28px;
    flex-grow: 1;
  }

  /* Sidebar Styling & Specific Thin Scrollbar */
  aside#sidebar-panel {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: var(--sidebar-width);
    background: linear-gradient(180deg, #b85c00 0%, #d46b00 35%, #e87d00 70%, #f78c00 100%);
    color: #ffffff;
    display: flex;
    flex-direction: column;
    z-index: 100;
    box-shadow: 4px 0 16px rgba(0,0,0,0.1);
    transition: width var(--transition-speed) ease;
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  /* Slim modern scrollbar specifically for sidebar menu list */
  aside#sidebar-panel .sidebar-menu::-webkit-scrollbar {
    width: 4px;
  }
  aside#sidebar-panel .sidebar-menu::-webkit-scrollbar-track {
    background: transparent;
  }
  aside#sidebar-panel .sidebar-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 4px;
  }
  aside#sidebar-panel .sidebar-menu::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.5);
  }

  body.sidebar-collapsed aside#sidebar-panel {
    width: var(--sidebar-collapsed-width);
  }

  .sidebar-brand {
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    background: rgba(0, 0, 0, 0.08);
  }

  .brand-logo {
    width: 34px;
    height: 34px;
    background: #ffffff !important;
    color: var(--primary-dark) !important;
    border-radius: var(--border-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.15rem;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .brand-name {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.5px;
    white-space: nowrap;
    opacity: 1;
    transition: opacity var(--transition-speed);
  }

  body.sidebar-collapsed .brand-name {
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-menu {
    list-style: none;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-grow: 1;
    overflow-y: auto;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: var(--border-radius-md);
    cursor: pointer;
    font-weight: 500;
    font-size: 0.9rem;
    color: rgba(255, 255, 255, 0.85);
    transition: all 0.2s ease;
    text-decoration: none;
    white-space: nowrap;
  }

  .menu-item i {
    font-size: 1.1rem;
    width: 20px;
    text-align: center;
    flex-shrink: 0;
  }

  .menu-item:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.15);
  }

  .menu-item.active {
    color: var(--primary-dark);
    background-color: #ffffff;
    font-weight: 700;
    box-shadow: 0 3px 10px rgba(0,0,0,0.13);
  }

  .sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 0.72rem;
    color: rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    background: rgba(0,0,0,0.08);
  }

  /* Sheet Selector Tabs Bar */
  .sheet-tabs-container {
    background: #ffffff;
    border-bottom: 2px solid var(--border-color);
    padding: 0 24px;
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }

  .sheet-tab {
    padding: 12px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    border-bottom: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .sheet-tab:hover {
    color: var(--primary);
  }

  .sheet-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background-color: var(--primary-light);
  }

  /* Views Animation */
  .page-view {
    display: none;
  }

  .page-view.active {
    display: block;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Dashboard Cards */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }

  .kpi-card {
    background-color: #ffffff;
    padding: 22px 24px;
    border-radius: var(--border-radius-md);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .kpi-card.accent { border-left-color: var(--accent); }
  .kpi-card.success { border-left-color: var(--success); }
  .kpi-card.warning { border-left-color: var(--warning); }
  .kpi-card.danger { border-left-color: var(--danger); }

  .kpi-info h4 {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .kpi-value {
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--primary-dark);
  }

  .kpi-icon {
    font-size: 2rem;
    color: rgba(230, 81, 0, 0.15);
  }

  .kpi-card:hover .kpi-icon {
    color: rgba(230, 81, 0, 0.3);
  }

  /* Section Card Panels */
  .card-panel {
    background-color: #ffffff;
    border-radius: var(--border-radius-md);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    padding: 24px;
    margin-bottom: 24px;
  }

  .card-header-clean {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  .card-title-clean {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title-clean i {
    color: var(--primary);
  }

  /* Header Section for View Titles (Replaces old navbar header) */
  .view-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    background: #ffffff;
    padding: 16px 20px;
    border-radius: var(--border-radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
  }

  .view-header-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Breadcrumb Navigation */
  .breadcrumb-nav {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    color: var(--text-muted);
    flex-wrap: wrap;
  }

  .breadcrumb-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .breadcrumb-item a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }

  .breadcrumb-item a:hover {
    text-decoration: underline;
    color: var(--primary-dark);
  }

  .breadcrumb-separator {
    color: #ccc;
    font-size: 0.75rem;
  }

  /* Buttons */
  .btn {
    padding: 8px 16px;
    border-radius: var(--border-radius-sm);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background-color: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    background-color: var(--primary-dark);
    box-shadow: 0 4px 10px rgba(230, 81, 0, 0.25);
  }

  .btn-outline {
    background-color: white;
    color: var(--primary);
    border-color: var(--border-color);
  }

  .btn-outline:hover {
    background-color: var(--primary-light);
    color: var(--primary-dark);
    border-color: var(--primary);
  }

  .btn-sm {
    padding: 5px 10px;
    font-size: 0.78rem;
  }

  /* Badges */
  .badge {
    padding: 4px 10px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .badge-primary { background-color: var(--primary-light); color: var(--primary-dark); }
  .badge-success { background-color: #e8f5e9; color: var(--success); }
  .badge-warning { background-color: #fff3e0; color: var(--warning); }
  .badge-danger { background-color: #ffebee; color: var(--danger); }

  /* Progress Bars */
  .progress-bar-bg {
    background-color: #eee;
    border-radius: 50px;
    height: 8px;
    width: 100%;
    overflow: hidden;
  }

  .progress-bar-fill {
    background: linear-gradient(90deg, #ffb830 0%, #f78c00 60%, #e07200 100%);
    height: 100%;
    border-radius: 50px;
    transition: width 0.5s ease;
    box-shadow: 0 1px 4px rgba(247, 140, 0, 0.35);
  }

  /*************************************************************
   * 4. PERFECT FREEZE / STICKY TABLE ARCHITECTURE
   *************************************************************/
  .table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .search-wrapper {
    position: relative;
    min-width: 250px;
  }

  .search-wrapper input {
    width: 100%;
    padding: 8px 12px 8px 36px;
    border-radius: var(--border-radius-sm);
    border: 1px solid var(--border-color);
    font-size: 0.85rem;
    outline: none;
    background: #ffffff;
    transition: border-color 0.2s;
  }

  .search-wrapper input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(230, 81, 0, 0.12);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* =====================================================================
     TABLE SCROLL CONTAINER
     GPU-accelerated, handles both axes, no overflow clipping issues
  ===================================================================== */
  .table-scroll-container {
    overflow: auto;
    max-height: calc(100vh - 300px);
    min-height: 200px;
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius-sm);
    margin-bottom: 16px;
    position: relative;
    background: #ffffff;
    /* GPU acceleration — eliminates flicker on scroll */
    transform: translateZ(0);
    -webkit-overflow-scrolling: touch;
    /* Custom scrollbar */
    scrollbar-width: thin;
    scrollbar-color: #e0a070 #f5f5f5;
  }
  .table-scroll-container::-webkit-scrollbar       { width: 7px; height: 7px; }
  .table-scroll-container::-webkit-scrollbar-track { background: #f5f5f5; }
  .table-scroll-container::-webkit-scrollbar-thumb { background: #e0a070; border-radius: 4px; }
  .table-scroll-container::-webkit-scrollbar-corner { background: #f5f5f5; }

  /* =====================================================================
     BASE TABLE
  ===================================================================== */
  table.bps-data-table {
    width: max-content;        /* let it grow beyond container width */
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.84rem;
    text-align: left;
    table-layout: fixed;
  }

  table.bps-data-table th,
  table.bps-data-table td {
    padding: 9px 13px;
    border-right: 1px solid #eeeeee;
    border-bottom: 1px solid #eeeeee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-sizing: border-box;
  }

  /* =====================================================================
     STICKY HEADER ROWS (top position computed dynamically by JS)
  ===================================================================== */
  table.bps-data-table thead tr th {
    position: sticky;
    top: 0;                          /* JS will override per-row */
    background-color: var(--primary-dark);
    color: #ffffff;
    z-index: 20;
    font-weight: 700;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }

  /* Filter row (last <tr> in <thead> rendered as <td>) */
  table.bps-data-table thead tr.column-filter-row td {
    position: sticky;
    background-color: #f5f5f5;
    z-index: 20;
    padding: 4px 6px;
    border-bottom: 2px solid var(--primary);
  }

  /* =====================================================================
     STICKY COLUMN 0 — Kode Wilayah
     Applied via class="col-sticky-0" on <th> and <td>
  ===================================================================== */
  .col-sticky-0 {
    position: sticky !important;
    left: 0 !important;
    z-index: 10;
    background-color: #ffffff;
    min-width: 110px;
    max-width: 110px;
    width: 110px;
    border-right: 1px solid #ddd !important;
  }

  /* =====================================================================
     STICKY COLUMN 1 — Nama Wilayah
     Applied via class="col-sticky-1" on <th> and <td>
  ===================================================================== */
  .col-sticky-1 {
    position: sticky !important;
    left: 110px !important;
    z-index: 10;
    background-color: #ffffff;
    min-width: 200px;
    max-width: 260px;
    width: 220px;
    /* Strong accent divider so columns don't bleed into each other */
    border-right: 3px solid var(--primary) !important;
    box-shadow: 4px 0 8px -2px rgba(0,0,0,0.14);
  }

  /* =====================================================================
     INTERSECTION CELLS — header & both sticky columns
     Top-left 2 cells in every header row: z-index must beat both stickies
  ===================================================================== */
  thead .col-sticky-0,
  thead .col-sticky-1 {
    z-index: 35 !important;
  }

  /* Specific bg colors for header intersections */
  thead th.col-sticky-0,
  thead th.col-sticky-1 {
    background-color: var(--primary-dark) !important;
  }

  /* For filter row intersection cells */
  thead tr.column-filter-row .col-sticky-0,
  thead tr.column-filter-row .col-sticky-1 {
    background-color: #f5f5f5 !important;
    z-index: 35 !important;
  }

  /* =====================================================================
     BODY ROW ALTERNATING COLOURS — sticky cols must match exactly
  ===================================================================== */
  table.bps-data-table tbody tr:nth-child(odd) td {
    background-color: #ffffff;
  }
  table.bps-data-table tbody tr:nth-child(even) td {
    background-color: #fffbf7;
  }
  table.bps-data-table tbody tr:hover td {
    background-color: #fff3e0 !important;
    cursor: pointer;
  }

  /* Sticky cols need explicit bg to avoid bleed-through on scroll */
  table.bps-data-table tbody tr:nth-child(odd) td.col-sticky-0,
  table.bps-data-table tbody tr:nth-child(odd) td.col-sticky-1 {
    background-color: #ffffff !important;
  }
  table.bps-data-table tbody tr:nth-child(even) td.col-sticky-0,
  table.bps-data-table tbody tr:nth-child(even) td.col-sticky-1 {
    background-color: #fffbf7 !important;
  }
  table.bps-data-table tbody tr:hover td.col-sticky-0,
  table.bps-data-table tbody tr:hover td.col-sticky-1 {
    background-color: #ffe0b2 !important;
    color: var(--primary-dark);
  }




  /* Sort-able header column styling */
  th.sort-header {
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  th.sort-header::after {
    content: ' ⇅';
    font-size: 0.75em;
    opacity: 0.5;
    margin-left: 4px;
  }
  th.sort-header.asc::after  { content: ' ▲'; opacity: 1; }
  th.sort-header.desc::after { content: ' ▼'; opacity: 1; }

  /* Column filter inputs */
  .column-filter-input {
    width: 100%;
    padding: 4px 6px;
    font-size: 0.78rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #fff;
    color: var(--text-main);
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.15s;
  }
  .column-filter-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(230,81,0,0.12);
  }

  /* Right-align numeric cells */
  td.text-right { text-align: right; }

  /* =====================================================================
     PAGINATION
  ===================================================================== */
  /* Pagination Styling */
  .table-pagination {

    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .pagination-controls {
    display: flex;
    gap: 4px;
  }

  .page-btn {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--border-radius-sm);
    border: 1px solid var(--border-color);
    background: white;
    color: var(--text-main);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  .page-btn:hover {
    background-color: var(--primary-light);
    color: var(--primary-dark);
  }

  .page-btn.active {
    background-color: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Full Screen Loading Overlay */
  #loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255, 255, 255, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(4px);
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--primary-light);
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }

  .loading-text {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--primary-dark);
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Toast Notifications */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: white;
    border-radius: var(--border-radius-md);
    box-shadow: var(--shadow-lg);
    padding: 12px 18px;
