<!-- Sidebar.html -->
<aside id="sidebar-panel">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <div class="brand-logo" style="background-color: var(--primary); color: white;">SE</div>
    <div style="display: flex; flex-direction: column;">
      <span class="brand-name" style="font-weight: 800; font-size: 1.05rem; color: #ffffff;">SE2026 BPS</span>
      <span style="font-size: 0.68rem; color: rgba(255,255,255,0.7); font-weight: 500;">Kabupaten Kebumen</span>
    </div>
  </div>
  
  <!-- Cache Control Bar inside Sidebar -->
  <div style="padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.15);">
    <button class="btn" id="btn-sidebar-refresh" onclick="refreshCacheData()" style="width: 100%; background: var(--primary); color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; transition: all 0.2s;">
      <i class="fas fa-sync-alt" id="refresh-icon"></i>
      <span id="refresh-btn-text">Segarkan Data Cache</span>
    </button>
    <div id="cache-status-text" style="font-size: 0.65rem; color: rgba(255,255,255,0.6); text-align: center; margin-top: 6px;">
      Cache: Memuat...
    </div>
  </div>
  
  <!-- Navigation Links -->
  <ul class="sidebar-menu">
    <!-- Menu Utama Section Header -->
    <li style="padding: 12px 16px 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.5); letter-spacing: 0.6px;">Menu Utama</li>
    
    <li>
      <a class="menu-item active" id="nav-dashboard" onclick="switchView('dashboard')">
        <i class="fas fa-chart-line"></i>
        <span>Dashboard Ringkasan</span>
      </a>
    </li>
    
    <li>
      <a class="menu-item" id="nav-compare" onclick="switchView('compare')">
        <i class="fas fa-balance-scale"></i>
        <span>Perbandingan Wilayah</span>
      </a>
    </li>
    
    <li>
      <a class="menu-item" id="nav-audit" onclick="switchView('audit')">
        <i class="fas fa-shield-virus"></i>
        <span>Audit Kualitas Data</span>
        <span id="audit-badge-counter" style="display: none; background-color: var(--danger); color: white; padding: 2px 6px; border-radius: 10px; font-size: 0.68rem; font-weight: 700; margin-left: auto;">0</span>
      </a>
    </li>
    
    <!-- Dynamic Sheets Section -->
    <li style="padding: 18px 16px 4px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.5); letter-spacing: 0.6px;">Tabel Data Sheet</li>
    
    <div id="dynamic-sheets-nav-container" style="display: flex; flex-direction: column; gap: 4px;">
      <div class="skeleton-text skeleton" style="height: 35px; border-radius: 8px; margin: 4px 12px;"></div>
      <div class="skeleton-text skeleton" style="height: 35px; border-radius: 8px; margin: 4px 12px;"></div>
      <div class="skeleton-text skeleton" style="height: 35px; border-radius: 8px; margin: 4px 12px;"></div>
    </div>
  </ul>
  
  <!-- Sidebar Footer -->
  <div class="sidebar-footer">
    <div>BPS Kabupaten Kebumen</div>
    <div style="font-size: 0.65rem; margin-top: 2px;">Sensus Ekonomi 2026 &copy; V1.1.0</div>
  </div>
</aside>
